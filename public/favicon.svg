<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="url(#glowPulse)" stroke-width="1.5"/>

  <!-- Glowing Spiral Ocean Wave Crest (Konoha / Great Wave fusion) -->
  <path d="M 14 36 C 14 36 20 20 32 20 C 44 20 48 30 42 37 C 38 41 32 40 31 36 C 30 32 35 30 36 33 C 37 36 33 37 32 37 C 26 37 24 30 29 25 C 34 20 44 22 47 28 C 50 34 46 44 38 47 C 28 50 18 45 16 38 Z" fill="url(#waveGrad)" filter="url(#neon)"/>

  <!-- Wave Ripple Lines -->
  <path d="M 12 43 C 18 37 26 38 32 43 C 38 48 46 48 52 42" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 16 49 C 22 45 28 46 33 50 C 38 53 44 52 48 49" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Sleek Play Triangle in heart of wave -->
  <polygon points="31,27 38,32 31,37" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(255,255,255,0.8))"/>
</svg>
